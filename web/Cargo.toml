# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "tm-web"
version = "0.1.0"
edition = "2024"
publish = false
# cargo-deny: workspace 外の独立 crate でもライセンスを明示する。
license = "AGPL-3.0-or-later"
description = "Browser (wasm) GPUI shell for the GPUI task manager"

# 親 workspace（work/gpui-task-manager/Cargo.toml）に巻き込まれないよう独立 crate にする。
# wasm32 ビルドは `trunk build` / `cargo check --target wasm32-unknown-unknown` で行う。
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# gpui-pre は Zed GPUI の再公開スナップショット（Apache-2.0）。
# wasm では既定 feature の multithreaded（wasm_thread / nightly 必須）を切る。
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }
# WebPlatform を直接構築し、CanvasFontFallback::EmojiAndCjk と FetchHttpClient を使うため。
gpui_web = { package = "gpui-pre-web", version = "=0.3.12", default-features = false }

# ドメイン / プレゼンテーション層はネイティブ版と共有する。
# path 依存にも version を書く（cargo-deny の wildcard 検査対策）。
tm-core = { path = "../crates/tm-core", version = "0.1.0", features = ["serde"] }
tm-viewmodel = { path = "../crates/tm-viewmodel", version = "0.1.0" }

anyhow = "1"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Location",
    "Storage",
    "UrlSearchParams",
    "Window",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
# Keep the target_features custom section: wasm-bindgen reads it to tell
# wasm-opt which Wasm features (e.g. bulk-memory) the binary uses. Stripping
# here makes wasm-opt reject memory.copy/fill; wasm-opt -Oz already strips.
strip = false
