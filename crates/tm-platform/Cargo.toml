[package]
name = "tm-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native SystemProbe implementation (sysinfo; rustix on Unix) for the GPUI task manager"

[dependencies]
tm-core = { workspace = true }
# default features を絞りつつ、温度センサー等の component 収集と GPU 列挙も有効化する
# （R1-GPUDATA）。system/disk/network/user は基本機能。
# gpu feature は sysinfo 0.40.3 の `Gpus`/`Gpu` API を有効化するだけなので
# Cargo.lock の依存グラフは変わらない（feature は lock に記録されない）。
sysinfo = { version = "=0.40.3", default-features = false, features = [
    "component",
    "system",
    "disk",
    "network",
    "user",
    "gpu",
] }

# rustix は POSIX シグナル送信（process::kill_process）と、R2X-D5B の
# f_bfree ベース used 値取得（fs::statvfs、safe API）に使う Unix 専用 API。
# Windows では sysinfo の Process::kill_with（taskkill /F）で代用するため、
# 依存自体を Unix ターゲットに限定して Windows ビルドに持ち込まない。
[target.'cfg(unix)'.dependencies]
# RUSTSEC-2026-0486 の修正版に完全固定する。
# fs feature は statvfs 用。新規クレートではなく既存 rustix の feature 追加のみ
# （unsafe FFI を自前で書かずに f_bfree を読むため）。
rustix = { version = "=1.1.6", features = ["process", "fs"] }
