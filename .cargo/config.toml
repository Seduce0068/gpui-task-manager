#
# リリース成果物へ開発環境の絶対パスが埋め込まれないようにする設定。
#
# 理由:
#   rustc は panic! の source_location や debug 情報にソースファイルの絶対パスを
#   埋め込む。GitHub Actions の /home/runner/... や開発ホストの /home/koppe/... が
#   バイナリへ残ると、公開時に内部パスやアカウント識別子が漏れる。
#   --remap-path-prefix はコンパイル時にそのプレフィックスを仮想パスへ置換する。
#   release-linux の strings ゲートは、この設定が効かなかった場合の検出装置である。
#
# 注意（既存設定との衝突回避）:
#   - RUSTFLAGS 環境変数が設定されると Cargo は [build].rustflags を無視する。
#     現時点で scripts/check.sh と .github/workflows/ci.yml に RUSTFLAGS は無く、
#     RUSTDOCFLAGS("-D warnings") は rustdoc のみに作用するため衝突しない。
#     将来 RUSTFLAGS を追加する場合は、同じ --remap-path-prefix を必ず含めること。
#   - このファイルはリポジトリ直下に置くため、別 workspace の web/ にも適用される。
#   - 置換先は固定の仮想パス /build とし、ホスト名 / アカウント名を残さない。
#     一般的な /home/ と /Users/ を先に置き、具体的なプレフィックスを後に置く
#     （rustc は複数指定を順に適用するため、後の指定が優先される。実測:
#     /tmp/=/build/ と /tmp/remap-probe=/build/foo の併記では後者が採用される）。
#   - ローカル作業ツリーは /home/koppe=/build だけだと /build/document/... として
#     残り、公開ゲートの remapped-dev-home / internal-workspace-root /
#     internal-worktree-dir に一致する。以下のローカル固有エントリでリポジトリ
#     ルートと、この worktree のルート（.agents/worktrees/integration-r1 配下の
#     target/ を含む）をまとめて /build/private へ置換する。
#     /build/document=... は remap 後に残ったパスの二次置換（多層防御）。
#     いずれも CI の /home/runner/... には一致しないため公開ゲートの
#     CI 側の false positive は発生しない。他の worktree を使う場合は
#     integration-r1 のエントリをその worktree 名に差し替えること。
[build]
rustflags = [
  "--remap-path-prefix=/home/=/build/",
  "--remap-path-prefix=/Users/=/build/",
  "--remap-path-prefix=/home/koppe=/build",
  "--remap-path-prefix=/home/runner=/build",
  "--remap-path-prefix=/Users/runner=/build",
  "--remap-path-prefix=/home/koppe/document=/build/private",
  "--remap-path-prefix=/build/document=/build/private",
  "--remap-path-prefix=/home/koppe/document/deepseek-harness/default-workspace/work/gpui-task-manager=/build/private",
  "--remap-path-prefix=/home/koppe/document/deepseek-harness/default-workspace/work/gpui-task-manager/.agents/worktrees/integration-r1=/build/private",
]
