# リリース成果物へ開発環境の絶対パスが埋め込まれないようにする設定。
#
# 理由:
#   rustc は panic! の source_location や debug 情報にソースファイルの絶対パスを
#   埋め込む。GitHub Actions の /home/runner/... や開発ホストの /home/<user>/... が
#   バイナリへ残ると、公開時に内部パスやアカウント識別子が漏れる。
#   --remap-path-prefix はコンパイル時にそのプレフィックスを仮想パスへ置換する。
#   release-linux の strings ゲートは、この設定が効かなかった場合の検出装置である。
#
# 注意（既存設定との衝突回避）:
#   - RUSTFLAGS 環境変数が設定されると Cargo は [build].rustflags を無視する。
#     現時点で scripts/check.sh と .github/workflows/ci.yml に RUSTFLAGS は無く、
#     RUSTDOCFLAGS("-D warnings") は rustdoc のみに作用するため衝突しない。
#     将来 RUSTFLAGS を追加する場合は、同じ --remap-path-prefix を必ず含めること。
#   - このファイルはリポジトリ直下に置くため、別 workspace の web/ にも適用される。
#   - 置換先は固定の仮想パス /build とし、ホスト名 / アカウント名を残さない。
#     一般的な /home/ と /Users/ を先に置き、具体的なプレフィックスを後に置く
#     （rustc は複数指定を順に適用するため、後の指定が優先される。実測:
#     /tmp/=/build/ と /tmp/remap-probe=/build/foo の併記では後者が採用される）。
#   - ローカル固有のホームや作業ツリーのパスは汎用プレースホルダで表し、
#     実パスをリポジトリへ残さない。共通の /home/ と /Users/ の置換を先に
#     適用し、個別のプレフィックスを後に置く（多層防御）。
#     いずれも CI の /home/runner/... には一致しないため公開ゲートの
#     CI 側の false positive は発生しない。
[build]
rustflags = [
  "--remap-path-prefix=/home/=/build/",
  "--remap-path-prefix=/Users/=/build/",
  "--remap-path-prefix=/home/<user>=/build",
  "--remap-path-prefix=/home/runner=/build",
  "--remap-path-prefix=/Users/runner=/build",
  "--remap-path-prefix=/home/<user>/<workspace>=/build/private",
  "--remap-path-prefix=/build/<workspace>=/build/private",
  "--remap-path-prefix=/home/<user>/<workspace>/<repo>=/build/private",
  "--remap-path-prefix=/home/<user>/<workspace>/<repo>/.agents/worktrees/<worktree>=/build/private",
]

# ahash の compile-time-rng（zed-xim 経由）によるビルド非決定性の fix。
#
# 根拠:
#   - zed-xim 0.4.0-zed の公開 Cargo.toml:102-105 は ahash 0.8 を
#     `features = ["compile-time-rng"], default-features = false` で固定依存し、
#     外すための feature flag は [features]（同 48-76 行）に存在しない。
#   - ahash 0.8.12 の get_fixed_seeds() は runtime-rng が無い構成で
#     const_random!(u64) × 8 を const RAND へ埋め込む
#     （src/random_state.rs:81-99）。これがビルドごとの app バイナリ差の原因。
#   - const-random 0.1.18 の README「Deterministic builds」は CONST_RANDOM_SEED
#     を公式の再現ビルド機構として定義している（同一コード＋同一シードで同一
#     出力）。const-random-macro 0.1.16 の src/span.rs:8-17 は option_env! で
#     これを読み、getrandom の代わりに SHAKE-256 のシードとして使う。
#
# 影響: ahash の compile-time シードは元々バイナリへ埋め込まれており秘密では
# ないため、固定化しても HashDoS 耐性は実質的に変わらない。runtime-rng を
# 追加して feature unification を変える方法と違い、no_std 側の制約も維持される。
[env]
# force = true: 開発シェルに CONST_RANDOM_SEED が設定されていても固定値を優先し、
# 環境差によるバイナリ差を防ぐ（Cargo の [env] は既定で force = false）。
CONST_RANDOM_SEED = { value = "gpui-task-manager-reproducible-ahash-seed-v1", force = true }
