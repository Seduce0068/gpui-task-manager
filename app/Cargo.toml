[package]
name = "gpui-task-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GPUI shell for the cross-platform task manager"

[[bin]]
name = "gpui-task-manager"
path = "src/main.rs"

[dependencies]
# Window icon for the X11/Xwayland backend (GPUI's `WindowOptions.icon` is
# `Option<Arc<image::RgbaImage>>`). Pinned to the same 0.25 line already in
# Cargo.lock via gpui; only the PNG decoder is needed here. On Wayland GPUI
# ignores this field and keeps using `app_id` / `StartupWMClass` instead.
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = "=0.9.1"
tm-core = { workspace = true, features = ["serde"] }
tm-viewmodel = { workspace = true }
tm-platform = { workspace = true }
serde_json = { workspace = true }

# C1-KEYRING: native Secret Service (org.freedesktop.secrets) token storage.
# Pinned to 5.2.0; `default-features = false` keeps the dependency minimal and
# the explicit `rt-async-io-crypto-rust` feature is required because this crate
# raises `compile_error!` when no crypto feature is selected (verified against
# crates.io metadata). It reuses the zbus 5.19.0 already present in Cargo.lock
# and avoids the OpenSSL backend.
[target.'cfg(unix)'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[build-dependencies]
