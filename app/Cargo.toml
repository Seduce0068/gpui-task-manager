[package]
name = "gpui-task-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GPUI shell for the cross-platform task manager"

[[bin]]
name = "gpui-task-manager"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.9.1"
tm-core = { workspace = true, features = ["serde"] }
tm-viewmodel = { workspace = true }
tm-platform = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
