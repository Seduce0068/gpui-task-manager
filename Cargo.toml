# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/tm-core",
    "crates/tm-viewmodel",
    "crates/tm-platform",
    "agent",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["gpui-task-manager contributors"]
description = "A cross-platform, browser-capable system task manager built with GPUI"

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-viewmodel = { path = "crates/tm-viewmodel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# GPUI + wgpu の debuginfo は巨大になる。試作のビルド時間・容量を抑える。
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
