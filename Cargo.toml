# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/tm-core",
    "crates/tm-viewmodel",
    "crates/tm-platform",
    "agent",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["gpui-task-manager contributors"]
description = "A cross-platform, browser-capable system task manager built with GPUI"

[workspace.dependencies]
# Dependency version/feature audit policy (see notes/dependency-audit.md):
# - Keep one shared version per crate here; members use `workspace = true` instead
#   of restating a conflicting version constraint.
# - A member may add `features = [...]` to a shared dependency, but that changes the
#   resolved feature set. Review it with `cargo tree -e features` before adding.
# - No new dependencies or breaking changes are introduced by the dependency audit;
#   the existing cargo-deny / cargo-vet gates must keep passing unchanged.
tm-core = { path = "crates/tm-core", version = "0.1.0" }
tm-viewmodel = { path = "crates/tm-viewmodel", version = "0.1.0" }
tm-platform = { path = "crates/tm-platform", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# GPUI + wgpu の debuginfo は巨大になる。
# バックトレースは残しつつ行テーブルのみに抑制する。
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
