# Dependabot configuration for the GPUI task manager.
#
# - Cargo dependencies are updated weekly, grouped to keep PR noise low.
# - GPUI crates are intentionally pinned to exact versions (ADR-001); their
#   version updates are ignored so a breaking weekly snapshot is never merged
#   by accident. Security updates still arrive through Dependabot alerts.
# - The browser shell is a separate Cargo workspace (web/) and is configured
#   separately.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: auto
    groups:
      gpui-stack:
        patterns:
          - "gpui*"
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "gpui*"
    ignore:
      # ADR-001: GPUI is pinned and updated deliberately, not by automation.
      - dependency-name: "gpui"
      - dependency-name: "gpui-pre*"
      - dependency-name: "gpui-kit"
      - dependency-name: "gpui-component"
      - dependency-name: "gpui-base"
      - dependency-name: "gpui-kit-assets"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    versioning-strategy: auto
    groups:
      gpui-stack:
        patterns:
          - "gpui*"
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "gpui*"
    ignore:
      - dependency-name: "gpui"
      - dependency-name: "gpui-pre*"
      - dependency-name: "gpui-kit"
      - dependency-name: "gpui-component"
      - dependency-name: "gpui-base"
      - dependency-name: "gpui-kit-assets"
    commit-message:
      prefix: "chore(web-deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
