# SPDX-License-Identifier: AGPL-3.0-or-later
# 個人リポジトリ共通の再利用可能ワークフロー（rust-gates.yml）へ委譲する。
# ゲート: fmt → check → test → clippy → cargo audit → cargo vet → markdownlint（extra_gates）。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # AGENTS.md §5 は共通ワークフローをタグ v1 にピン留めする方針だが、
    # R2 の supply-chain 要件で外部参照の SHA 固定を強制するため、v1 の解決先
    # コミットを SHA で固定する（末尾の v1 は可読性のためのコメント）。
    # v1 タグを付け替えるときは、この SHA も同時に更新すること。
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@b7675efd8a9a84ebc5b560da628d1a82f3fbf98f # v1
    with:
      working_directory: .
      # 再利用ワークフローの `locked` 入力（既定 true）で check/test/clippy に
      # --locked を明示的に付ける。Cargo.lock の暗黙の更新を防ぐ。
      locked: true
      apt_packages: |
        pkg-config
        libfontconfig-dev
        libfreetype-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
        libwayland-dev
        libx11-xcb-dev
      audit: true
      # §15: unsafe は forbid(unsafe_code) で禁止し、lint でも検知する。
      clippy_args: "-D clippy::undocumented_unsafe_blocks"
      # cargo-vet: supply-chain/ ストア（root / web）の整合確認。
      # バージョンは notes/cargo-vet-adoption.md の固定方針に合わせる。
      # taiki-e/install-action が cargo-vet 未対応のため cargo install で導入する。
      # root の exempt は `baseline-unreviewed`（未監査ベースライン）に変更済み。
      # このゲートは依存セットのドリフト検出であり、監査済みの保証ではない。
      # 実レビュー後は `audited` criteria で certify し、exempt を更新する。
      extra_gates: |
        # web/ is a separate Cargo workspace, so the reusable workflow's
        # root-only clippy/test gates do not cover it. Mirror scripts/check.sh.
        cargo fmt --manifest-path web/Cargo.toml --all --check
        cargo clippy --manifest-path web/Cargo.toml --all-targets -- \
          -D warnings -D clippy::undocumented_unsafe_blocks
        cargo test --manifest-path web/Cargo.toml --lib
        cargo install cargo-vet --version 0.10.3 --locked
        cargo vet --locked
        (cd web && cargo vet --locked)
        # ADR-009: detect newly introduced unused dependencies.
        cargo install cargo-machete --version 0.10.1 --locked
        cargo machete
        (cd web && cargo machete)
        # Broken intra-doc links are not caught by clippy/test gates.
        RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
        RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path web/Cargo.toml --no-deps
        # Markdown documentation lint. Globs, ignores and disabled rules are
        # defined once in the repository-root .markdownlint-cli2.jsonc and are
        # shared with scripts/check.sh; no scope flags are duplicated here.
        npm install --global markdownlint-cli2@0.24.1
        markdownlint-cli2 --config .markdownlint-cli2.jsonc
        # Disclosure gate: fail if development paths / account identifiers leak
        # back into published docs (regression guard for the publication review).
        bash scripts/check-public-docs.sh
        # Secret scanning with gitleaks (both working tree and git history).
        # R4-CI01: 旧来は tarball と checksums.txt を同じ GitHub release から
        # 取得していたため、配布元侵害時に改ざんバイナリと一致するチェックサム
        # が一緒に配信され真正性検証にならなかった。期待 SHA256 を repo 内へ
        # ピン留めし（git 履歴がトラストアンカー）、リリース側の checksums.txt
        # には依存しない。GITLEAKS_VERSION を更新するときは
        # GITLEAKS_SHA256 も公式リリースの checksums.txt から取り直して必ず
        # 同時に更新する。対応を忘れると sha256sum -c が失敗するため放置できない。
        GITLEAKS_VERSION=8.30.1
        # sha256(gitleaks_8.30.1_linux_x64.tar.gz), official v8.30.1 release.
        GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        (
          cd /tmp
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            -o "${GITLEAKS_ARCHIVE}"
          # Expected digest is the in-repo pin, NOT a same-origin download.
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${GITLEAKS_ARCHIVE}" > gitleaks_expected.txt
          sha256sum -c gitleaks_expected.txt || exit 1
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
        )
        # gates is a reusable-workflow delegation, so the checkout depth here
        # is not controlled by this repository. Ensure full history is present
        # before scanning; `detect` below covers working tree + history.
        git fetch --unshallow || true
        /tmp/gitleaks version
        /tmp/gitleaks detect --source . --redact --exit-code 1

  wasm:
    name: wasm check (tm-core / tm-viewmodel / web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check wasm targets
        run: |
          cargo check --locked --target wasm32-unknown-unknown -p tm-core -p tm-viewmodel
          cargo check --locked --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

  # Cargo.toml / web/Cargo.toml で宣言した rust-version = "1.95" を固定検証する。
  # 共通ワークフロー rust-gates.yml に MSRV 入力が無いため、リポジトリ側で実行。
  # sysinfo 0.40.3（tm-platform 経由）が rust-version 1.95 を要求し、gpui-pre-util
  # も不安定機能 `slice_as_array` を使うため、MSRV を 1.95 へ引き上げた。
  # 以前の 1.92 では workspace 全体をビルドできず portable crate に限定していたが、
  # 要件が解消されたため workspace 全体を検証する。
  # web/ は [workspace] による独立 workspace なのでルートの --workspace には
  # 含まれない。同じジョブで wasm32 ターゲットを指定した web のチェックも
  # 実行し、web/Cargo.toml の rust-version = "1.95" 宣言を実検証する。
  msrv-1-95:
    name: MSRV 1.95 check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.95.0"
          # web/ は独立 workspace かつ wasm32 向け crate。同じ 1.95.0 に
          # wasm32 ターゲットを追加するだけ（rustup target add）で、
          # apt パッケージの新規導入は不要。これで web の MSRV も検証できる。
          targets: wasm32-unknown-unknown
      - name: Install build dependencies
        run: |
          # Ubuntu mirror can return transient 503s; retry a few times so a
          # runner-side hiccup does not fail unrelated checks.
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev
      - name: Check workspace with MSRV
        run: cargo +1.95.0 check --workspace --locked
      # web/ は独立 workspace のため上の --workspace には含まれない。
      # wasm32 ターゲットを指定して web の rust-version = "1.95" 宣言を
      # 実際に検証する（宣言のみで未検証、という状態を避ける）。
      - name: Check web workspace with MSRV (wasm32)
        run: cargo +1.95.0 check --manifest-path web/Cargo.toml --target wasm32-unknown-unknown --locked

  # CDP 実動検証スクリプトの CI ゲート（R1-V01）。
  # GitHub Actions の Linux runner では静的サーバ/ヘッドレス Chrome の起動と
  # GPUI の canvas 描画が不安定なため、実機 CDP 検証は開発ホストの手動手順とし、
  # CI では各スクリプトの --self-check（CDP 不要のオフライン検証）と
  # py_compile（構文チェック）をゲートにする。どちらかが失敗するとジョブが落ちる。
  #
  # 実機 CDP の手動手順（開発ホスト / Kubuntu、README と同じ並び）:
  #   cd web && trunk build --release && cd ..
  #   python3 -m http.server 8091 --bind 127.0.0.1 -d web/dist   # 別シェル
  #   google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
  #     --window-size=1440,1000 --remote-debugging-port=9223 \
  #     --user-data-dir=/tmp/tm-web-chrome about:blank           # 別シェル
  #   python3 web/scripts/cdp_verify_web.py --url http://127.0.0.1:8091/ \
  #     --out notes/assets --evidence-out web/verification --prefix web-shell --label demo
  #   python3 web/scripts/cdp_verify_settings.py \
  #     --url http://127.0.0.1:8091/ --evidence /tmp/settings-evidence.json
  #   python3 web/scripts/cdp_verify_ime.py --dist web/dist \
  #     --out notes/assets --evidence /tmp/ime-evidence.json
  #     （cdp_verify_ime.py のみ静的サーバと Chrome を自己起動するため、
  #       上記の手動起動は不要。dist ではなく web/dist を指定すること）
  #   各スクリプトは検査失敗時に終了コード 1 を返す。
  cdp-verify:
    name: cdp verify (offline self-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Syntax check (py_compile)
        run: python3 -m py_compile web/scripts/cdp_verify_*.py poc-wasm/scripts/cdp_verify.py
      - name: Offline self-check
        run: |
          set -euo pipefail
          for script in web/scripts/cdp_verify_*.py poc-wasm/scripts/cdp_verify.py; do
            echo "==> python3 ${script} --self-check"
            python3 "${script}" --self-check
          done

  # Windows / macOS は開発ホスト（Linux）に実機が無いため、GitHub Actions の
  # windows-latest / macos-latest を「実機相当の検証」として位置づける。
  # どちらも `cargo check --workspace` で app（GPUI）を含む全クレートを型検査し、
  # OS 固有の cfg 分岐が壊れていないことを確認する。
  native-windows:
    name: native check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check workspace
        run: cargo check --locked --workspace
      # R1-V02: Windows 側でも tm-platform のテストを実行する（macOS と同対象）。
      - name: Test portable and platform crates
        run: cargo test --locked -p tm-core -p tm-viewmodel -p tm-platform

  native-macos:
    name: native check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Test portable and platform crates
        run: cargo test --locked -p tm-core -p tm-viewmodel -p tm-platform

  # ライセンス・脆弱性・重複バージョンのゲート。ポリシーは deny.toml（ルート）に置く。
  # advisory ignore の有効期間は各 ignore の expiry（2027-02-18）で強制する。
  # レビュー日 2026-11-19（JST）は UTC では 2026-11-18 相当なので、
  # check-advisory-ignores.sh の UTC 基準 3 か月上限は 2027-02-18 となる
  # （deny.toml の 9 件の expiry と一致）。cargo-deny 0.21 が期限切れを検知し、
  # `-D advisory-ignore-expired` でゲートを失敗させる（手動レビュー依存ではない）。
  # R4-CI01: 旧来の `-A advisory-not-detected` は削除した。cargo-deny 0.21 の
  # 当該 lint は「ignore が依存グラフに一致しなかった」という警告（既定値
  # unused-ignored-advisory = "warn"）であり、allow すると古い ignore と
  # DB 未読み込みの兆候を同時に隠してしまう。scripts/check.sh とフラグを
  # 揃えるため警告は残しつつ、失敗条件は `-D advisory-ignore-expired` に
  # 一本化する。さらに check-advisory-db.sh で DB の読み込み自体を
  # 件数アサートし、空 DB の「0 件」をクリーンな結果と混同しないようにする。
  deny:
    name: cargo-deny (licenses / advisories / duplicates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ツール別タグ @cargo-deny は更新される moving tag で、上流 README も
      # SHA 固定を非推奨とする。immutable な v2.90.6 のコミットへ固定し、
      # 導入するツール版も明示する（pin 版のマニフェスト: cargo-deny 0.21.0）。
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.21.0
      - name: Validate advisory ignore policy (reason / expiry / 3-month cap)
        run: bash scripts/check-advisory-ignores.sh
      - name: Check native workspace
        run: cargo deny --manifest-path Cargo.toml check -D advisory-ignore-expired
      - name: Check web workspace
        run: cargo deny --manifest-path web/Cargo.toml check -D advisory-ignore-expired
      - name: Assert advisory database was loaded
        run: bash scripts/check-advisory-db.sh

  # リリース成果物（Linux バイナリ + DEB）。検証とは分離し、必要なときだけ
  # ダウンロードできるようにする。
  release-linux:
    name: release artifacts (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [gates, deny, wasm, native-windows, native-macos, msrv-1-95, cdp-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install build dependencies
        run: |
          # Same mirror retry policy as the MSRV job.
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            jq
      - name: Build release binary
        # gates の locked: true と揃え、暗黙の Cargo.lock 更新を禁止する。
        run: cargo build --release --locked -p gpui-task-manager
      - name: Build DEB
        run: bash packaging/linux/build-deb.sh --skip-build
      # 公開成果物の開示ゲート。gitleaks --redact と同じ方針で、一致した文字列は
      # CI ログへ出さずパターン名のみを報告する。upload 直前に置くことで、
      # 開発パス / アカウント識別子が混入した成果物が配布されるのを防ぐ。
      - name: Gate - no development paths in release binary
        run: |
          set -euo pipefail
          binary="target/release/gpui-task-manager"
          if [ ! -f "${binary}" ]; then
            echo "binary-disclosure: ${binary} is missing" >&2
            exit 1
          fi
          if ! command -v strings >/dev/null 2>&1; then
            echo 'binary-disclosure: strings (binutils) is not available' >&2
            exit 1
          fi
          dump="$(mktemp)"
          trap 'rm -f -- "${dump}"' EXIT
          strings -a -- "${binary}" > "${dump}"

          # パターン名 -> 拡張正規表現。一致行は絶対に出力しない（--redact 相当）。
          check() {
            local name="$1" pattern="$2"
            if grep -Eq -- "${pattern}" "${dump}"; then
              echo "binary-disclosure: pattern '${name}' found in ${binary} (value redacted)" >&2
              exit 1
            fi
          }
          check dev-home-path '/home/'
          check account-identifier '(koppe|onoderakeita)'
          check noreply-email '[0-9]{6,}\+[A-Za-z0-9_-]+@users\.noreply\.github\.com'
          check tailscale-domain 'tail[0-9A-Za-z_-]+\.ts\.net'
          # remap-path-prefix replaces /home/ with /build/, so the existing
          # dev-home-path check cannot see an internal worktree path. Match the
          # path fragments that survive the remap instead (name only, redacted).
          # A bare `work/gpui-` would also match the normal Actions checkout
          # /home/runner/work/gpui-task-manager/..., so require the internal
          # `default-workspace/` component to keep a clean CI build passing.
          check internal-worktree-dir '\.agents/worktrees'
          check internal-workspace-root 'default-workspace/work/gpui-'
          check remapped-dev-home '/build/document/'
          # 単独の 64-hex トークンを検出。素の `[0-9a-fA-F]{64}` は依存
          # クレートの連結 hex 定数に一致し現行ビルドで誤検知するため境界を要求。
          check token-like-hex '\b[0-9a-fA-F]{64}\b'
          echo 'binary-disclosure: OK (no development paths / account identifiers / token-like hex in release binary)'
      # .deb に同梱される licenses/crates/** とドキュメント類はバイナリの
      # strings 走査では見えないため、upload 直前に /tmp へ展開して同梱
      # ドキュメントと licenses/ 配下の全ファイルを走査する。
      # 一致値は出力せずパターン名のみを報告（--redact と同方針）。
      - name: Gate - no development paths in DEB payload
        run: |
          set -euo pipefail
          deb_files=()
          for candidate in packaging/linux/build/*.deb; do
            [ -f "${candidate}" ] || continue
            deb_files+=("${candidate}")
          done
          if (( ${#deb_files[@]} == 0 )); then
            echo 'deb-disclosure: no .deb file found in packaging/linux/build' >&2
            exit 1
          fi
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            echo 'deb-disclosure: dpkg-deb is not available' >&2
            exit 1
          fi
          extract_dir="$(mktemp -d)"
          dump="$(mktemp)"
          # 空文字や / を rm -rf しないよう :? ガードを付けて cleanup する。
          trap 'rm -rf -- "${extract_dir:?}"; rm -f -- "${dump:?}"' EXIT
          for package in "${deb_files[@]}"; do
            dpkg-deb -x -- "${package}" "${extract_dir}"
          done
          # バイナリは上の release binary ゲートが走査済み。ここでは未カバーだった
          # 同梱ドキュメントと licenses/ 配下（crates/** を含む）を全件走査する。
          doc_root="${extract_dir}/usr/share/doc"
          if [ ! -d "${doc_root}" ]; then
            echo 'deb-disclosure: expected doc directory is missing from .deb payload' >&2
            exit 1
          fi
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find "${doc_root}" -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo 'deb-disclosure: no files found in .deb doc payload' >&2
            exit 1
          fi

          # パターン名 -> 拡張正規表現。一致行は絶対に出力しない（--redact 相当）。
          check() {
            local name="$1" pattern="$2" file rel
            for file in "${files[@]}"; do
              strings -a -n 6 -- "${file}" > "${dump}"
              if grep -Eq -- "${pattern}" "${dump}"; then
                rel="${file#"${extract_dir}"/}"
                echo "deb-disclosure: pattern '${name}' found in ${rel} (value redacted)" >&2
                exit 1
              fi
            done
          }
          check dev-home-path '/home/(koppe|onoderakeita)/'
          check account-identifier '(koppe|onoderakeita)'
          check noreply-email '[0-9]{6,}\+[A-Za-z0-9_-]+@users\.noreply\.github\.com'
          check tailscale-domain 'tail[0-9A-Za-z_-]+\.ts\.net'
          check internal-worktree-dir '\.agents/worktrees'
          check internal-workspace-root 'default-workspace/work/gpui-'
          check remapped-dev-home '/build/document/'
          # 単独の 64-hex トークンを検出（長い hex 定数の部分列は除外）。
          check token-like-hex '\b[0-9a-fA-F]{64}\b'
          echo 'deb-disclosure: OK (no development paths / account identifiers / token-like hex in .deb payload)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-task-manager-linux
          path: |
            target/release/gpui-task-manager
            packaging/linux/build/*.deb
          if-no-files-found: error

  # ブラウザ版の配布物（dist）。trunk を CI で導入してビルドする。
  web-dist:
    name: web dist artifact
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [gates, deny, wasm, native-windows, native-macos, msrv-1-95, cdp-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      # immutable な v2.90.6 のコミット + ツール版を明示（マニフェストの latest）。
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: trunk@0.22.1
      # scripts/vendor-crate-licenses.sh parses `cargo metadata` with jq, the
      # same hard dependency build-deb.sh installs in release-linux. Install
      # it here too so the shared script behaves identically in both jobs.
      - name: Install jq for crate-license vendoring
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends jq
      - name: Build web distribution
        # The bundled IBM Plex fonts are OFL-1.1; ship the license with the
        # artifact (Trunk 0.22 has no `copy` config key).
        # AGPL-3.0 本文と帰属通知／第三者ライセンス本文も配布物へ同梱する。
        run: |
          set -euo pipefail
          cd web
          # trunk 0.22.1 の --locked は Cargo.lock が最新であることを要求する。
          # gates の locked: true と同じロック整合性を wasm ビルドにも適用する。
          trunk build --release --locked
          # ルートの LICENSE (AGPL-3.0) / NOTICE.md / THIRD_PARTY_NOTICES.md を
          # dist/ へコピーし、配布アーカイブ単体でライセンス要件を満たす。
          cp ../LICENSE dist/LICENSE
          cp ../NOTICE.md dist/NOTICE.md
          cp ../THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp assets/fonts/LICENSE-IBM-Plex.txt dist/LICENSE-IBM-Plex.txt
          # R4-CI01: crate 別ライセンス全文は DEB と同じ共有スクリプトで
          # web ワークスペースの wasm32 依存グラフから生成する。旧来の
          # ../packaging/linux/licenses/crates は repo に存在せず常に
          # スキップされていた。生成は必須で、空ならビルドを失敗させる。
          bash ../scripts/vendor-crate-licenses.sh dist/licenses Cargo.toml wasm32-unknown-unknown
          if [ ! -d dist/licenses/crates ] ||
            [ -z "$(find dist/licenses/crates -type f -print -quit)" ]; then
            echo 'web-dist: licenses/crates is missing or empty' >&2
            exit 1
          fi
          for f in LICENSE NOTICE.md THIRD_PARTY_NOTICES.md LICENSE-IBM-Plex.txt; do
            test -s "dist/${f}"
          done
      # R2 ビルド再現性ゲート。Trunk 0.22.x の modulepreload 順序は
      # HashSet 由来で非決定的なので、Trunk.toml の post_build フックで
      # パス順へ正規化している。ここで同一入力の 2 回ビルドを比較し、
      # 正規化が効かなくなった回帰を公開前に検出する。
      - name: Gate - deterministic dist (double build SHA256)
        run: |
          set -euo pipefail
          cd web
          hash_dist() {
            # 内容と相対パスをまとめてハッシュし、順序はパス順に固定する。
            # find dist -type f なので dist/ へコピーした LICENSE / NOTICE /
            # THIRD_PARTY_NOTICES / crate 別ライセンスも自動的に対象になる。
            find dist -type f -print0 | sort -z | xargs -0 -r sha256sum
          }
          hash_dist > /tmp/web-dist-sha256-first.txt
          # 2 回目も 1 回目と同じ手順（ライセンスコピーを含む）でビルドする。
          # trunk build は dist/ を作り直すため、コピーを必ず再実行する。
          trunk build --release --locked
          cp ../LICENSE dist/LICENSE
          cp ../NOTICE.md dist/NOTICE.md
          cp ../THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp assets/fonts/LICENSE-IBM-Plex.txt dist/LICENSE-IBM-Plex.txt
          # 初回と同じ共有スクリプトで licenses/crates を再生成する（R4-CI01）。
          bash ../scripts/vendor-crate-licenses.sh dist/licenses Cargo.toml wasm32-unknown-unknown
          if [ ! -d dist/licenses/crates ] ||
            [ -z "$(find dist/licenses/crates -type f -print -quit)" ]; then
            echo 'web-dist: licenses/crates is missing or empty (second build)' >&2
            exit 1
          fi
          for f in LICENSE NOTICE.md THIRD_PARTY_NOTICES.md LICENSE-IBM-Plex.txt; do
            test -s "dist/${f}"
          done
          hash_dist > /tmp/web-dist-sha256-second.txt
          if ! diff -u /tmp/web-dist-sha256-first.txt /tmp/web-dist-sha256-second.txt; then
            echo 'web-dist: two consecutive builds produced different output' >&2
            exit 1
          fi
          echo 'web-dist: OK (two consecutive builds are byte-identical)'
      # 公開成果物（wasm / JS に加え同梱の LICENSE / NOTICE /
      # licenses/crates/** など）の開示ゲート。release-linux と同じ方針で、
      # remap をすり抜ける内部 worktree パスを検知する。一致行は出力しない。
      - name: Gate - no development paths in web dist
        run: |
          set -euo pipefail
          # wasm / JS に限定せず dist 配下の全ファイルを走査する。
          mapfile -d '' -t files < <(find web/dist -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo 'web-disclosure: no files found in web/dist' >&2
            exit 1
          fi
          if ! command -v strings >/dev/null 2>&1; then
            echo 'web-disclosure: strings (binutils) is not available' >&2
            exit 1
          fi
          dump="$(mktemp)"
          trap 'rm -f -- "${dump}"' EXIT

          # パターン名 -> 拡張正規表現。一致行は絶対に出力しない（--redact 相当）。
          # 素の `/home/` は wasm 内の一般的な文字列リテラルにも一致しうるため、
          # アカウント名を伴う形に限定する（check-public-docs.sh と同じ方針）。
          check() {
            local name="$1" pattern="$2" file
            for file in "${files[@]}"; do
              strings -a -n 6 -- "${file}" > "${dump}"
              if grep -Eq -- "${pattern}" "${dump}"; then
                echo "web-disclosure: pattern '${name}' found in ${file} (value redacted)" >&2
                exit 1
              fi
            done
          }
          check dev-home-path '/home/(koppe|onoderakeita)/'
          check account-identifier '(koppe|onoderakeita)'
          check noreply-email '[0-9]{6,}\+[A-Za-z0-9_-]+@users\.noreply\.github\.com'
          check tailscale-domain 'tail[0-9A-Za-z_-]+\.ts\.net'
          check internal-worktree-dir '\.agents/worktrees'
          check internal-workspace-root 'default-workspace/work/gpui-'
          check remapped-dev-home '/build/document/'
          # 単独の 64-hex トークンを検出。素の `[0-9a-fA-F]{64}` は wasm 内の
          # 依存クレート hex 定数（現行ビルド 9 件）に誤一致するため境界を要求。
          check token-like-hex '\b[0-9a-fA-F]{64}\b'
          echo 'web-disclosure: OK (no development paths / account identifiers / token-like hex in web dist)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-task-manager-web
          path: web/dist
          if-no-files-found: error

  # ソフトウェア部品表（SBOM）。CycloneDX JSON を native/web ワークスペース
  # ごとに生成し、監査・供給網確認用の成果物として保持する。
  sbom:
    name: sbom (cyclonedx)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [gates, deny, wasm, native-windows, native-macos, msrv-1-95, cdp-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # immutable な v2.90.6 のコミット + ツール版を明示（マニフェストの latest）。
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-cyclonedx@0.5.10
      # cargo-cyclonedx 0.5.10 には --locked オプションが無いため、
      # gates の locked: true と同じ整合性を生成前後の2か所で担保する:
      # (1) 生成直前の cargo metadata --locked（下のステップ）
      # (2) 生成直後の git diff --exit-code -- Cargo.lock web/Cargo.lock
      # generate-sbom.sh 側では --target を明示し、SOURCE_DATE_EPOCH で
      # バイト単位の再現性も確保している（下の SHA256 ゲートで検証）。
      - name: Verify Cargo.lock consistency before SBOM generation
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path web/Cargo.toml >/dev/null
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          bash scripts/generate-sbom.sh target/sbom
          # --locked の実質ゲート: 生成処理がロックファイルを書き換えていないか確認。
          git diff --exit-code -- Cargo.lock web/Cargo.lock
      # 2 回連続で生成し、成果物のファイル集合と内容（SHA256）が変わらない
      # ことと、生成元ファイルが作業ツリーに残らないことを確認する。
      # cargo-cyclonedx は SOURCE_DATE_EPOCH 指定時に serialNumber を省略し
      # timestamp を固定するため、内容もバイト単位で再現可能になる。
      - name: Verify SBOM generation is idempotent
        run: |
          set -euo pipefail
          # ファイル名だけでなく内容も比較する（パス名でソートして順序を固定）。
          snapshot() {
            find target/sbom -maxdepth 1 -type f -name '*.json' -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          }
          before="$(snapshot)"
          bash scripts/generate-sbom.sh target/sbom
          after="$(snapshot)"
          test "${before}" = "${after}"
          test -n "${after}"
          # bom-ref の file:// 絶対パスは現状を許容する: cargo-cyclonedx の
          # path 依存表現（#name@version 付き）であり、ビルド元 workspace の
          # 位置を反映する情報であって秘密ではない。正規化には全 BOM の
          # 書換えが必要で監査上の付加価値が薄いため、そのまま保持する。
          # 同様に upstream の author フィールドに含まれる GitHub の noreply
          # メールは正当なクレート・メタデータとして保持する方針とする。
          # これらは開示ゲート（check-public-docs.sh）の対象外: 同ゲートは
          # 公開 Markdown 文書を走査し、SBOM 成果物やクレート来源メタデータは
          # 対象に含めない。
          if find . -path ./target -prune -o -type f \
              \( -name 'sbom-root*.json' -o -name 'sbom-web*.json' \) -print \
              | grep -q .; then
            echo 'Uncollected SBOM files remain in the worktree.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpui-task-manager-sbom
          path: target/sbom
          if-no-files-found: error
