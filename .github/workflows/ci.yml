# SPDX-License-Identifier: Apache-2.0
# 個人リポジトリ共通の再利用可能ワークフロー（rust-gates.yml）へ委譲する。
# ゲート: fmt → check → test → clippy → cargo audit。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      working_directory: .
      apt_packages: |
        pkg-config
        libfontconfig-dev
        libfreetype-dev
        libxkbcommon-dev
        libxkbcommon-x11-dev
        libwayland-dev
        libx11-xcb-dev
      audit: true

  wasm:
    name: wasm check (tm-core / tm-viewmodel / web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check wasm targets
        run: |
          cargo check --target wasm32-unknown-unknown -p tm-core -p tm-viewmodel
          cargo check --target wasm32-unknown-unknown --manifest-path web/Cargo.toml

  # Windows / macOS は開発ホスト（Linux）に実機が無いため、GitHub Actions の
  # windows-latest / macos-latest を「実機相当の検証」として位置づける。
  # どちらも `cargo check --workspace` で app（GPUI）を含む全クレートを型検査し、
  # OS 固有の cfg 分岐が壊れていないことを確認する。
  native-windows:
    name: native check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace
      - name: Test portable crates
        run: cargo test -p tm-core -p tm-viewmodel

  native-macos:
    name: native check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace
      - name: Test portable and platform crates
        run: cargo test -p tm-core -p tm-viewmodel -p tm-platform

  # ライセンス・脆弱性・重複バージョンのゲート。ポリシーは deny.toml（ルート）に置く。
  deny:
    name: cargo-deny (licenses / advisories / duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - name: Check native workspace
        run: cargo deny --manifest-path Cargo.toml check
      - name: Check web workspace
        run: cargo deny --manifest-path web/Cargo.toml check

  # リリース成果物（Linux バイナリ + DEB）。検証とは分離し、必要なときだけ
  # ダウンロードできるようにする。
  release-linux:
    name: release artifacts (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            jq
      - name: Build release binary
        run: cargo build --release -p gpui-task-manager
      - name: Build DEB
        run: bash packaging/linux/build-deb.sh --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-task-manager-linux
          path: |
            target/release/gpui-task-manager
            packaging/linux/build/*.deb
          if-no-files-found: error

  # ブラウザ版の配布物（dist）。trunk を CI で導入してビルドする。
  web-dist:
    name: web dist artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build web distribution
        run: cd web && trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-task-manager-web
          path: web/dist
          if-no-files-found: error
